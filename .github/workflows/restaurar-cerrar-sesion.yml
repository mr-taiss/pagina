name: Restaurar cerrar sesión

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Restaurar botón Cerrar sesión
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '''<button\n                    class="return-welcome"\n                    onclick="returnToWelcome()">\n\n                    ← Volver a portada\n\n                </button>'''
          new = '''<button\n                    class="return-welcome"\n                    onclick="returnToWelcome()">\n\n                    Cerrar sesión\n\n                </button>'''
          if old not in s:
              raise SystemExit('No se encontró el botón esperado; no se modificó el archivo.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Restaurar opción Cerrar sesión"
          git push

      - name: Eliminar workflow de reparación
        if: always() && github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/restaurar-cerrar-sesion.yml || true
          git commit -m "Eliminar workflow temporal" || true
          git push || true
