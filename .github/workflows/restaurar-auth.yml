name: Restaurar autenticación SISGOP

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore-auth:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restaurar auth.js y conectarlo al proyecto
        shell: bash
        run: |
          set -e
          mkdir -p .github/workflows
          curl -fsSL https://raw.githubusercontent.com/mr-taiss/proyecto/main/auth.js -o auth.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          if 'src="auth.js"' not in text:
              text = text.replace('</body>', '    <script src="auth.js"></script>\n</body>')
          text = text.replace('onclick="returnToWelcome()"', 'onclick="logoutSISGOP()"')
          p.write_text(text, encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html auth.js
          git diff --cached --quiet && exit 0
          git commit -m 'Restaurar inicio de sesión y cambio de contraseña'
          git push

      - name: Eliminar workflow temporal
        if: success()
        shell: bash
        run: |
          git rm .github/workflows/restaurar-auth.yml || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Eliminar workflow temporal de restauración'
          git push
